<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gravador Respiratório</title>
</head>
<body>

<button id="start">Gravar</button>
<button id="stop">Parar</button>
<button id="play">Reproduzir</button>

<p id="status"></p>

<script>

let mediaRecorder;
let audioChunks = [];
let audioUrl = "";

const status = document.getElementById("status");

async function setupRecorder() {

    const stream = await navigator.mediaDevices.getUserMedia({
        audio: true
    });

    mediaRecorder = new MediaRecorder(stream);

    mediaRecorder.ondataavailable = e => {
        audioChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {

        const audioBlob = new Blob(audioChunks, {
            type: 'audio/mp4'
        });

        audioChunks = [];

        audioUrl = URL.createObjectURL(audioBlob);

        localStorage.setItem("ultimoAudio", audioUrl);

        status.innerText = "Áudio gravado!";
    };
}

document.getElementById("start").onclick = async () => {

    if (!mediaRecorder) {
        await setupRecorder();
    }

    audioChunks = [];

    mediaRecorder.start();

    status.innerText = "Gravando...";
};

document.getElementById("stop").onclick = () => {

    mediaRecorder.stop();

    status.innerText = "Finalizando...";
};

document.getElementById("play").onclick = () => {

    if (!audioUrl) {
        alert("Nenhum áudio disponível");
        return;
    }

    const audio = new Audio(audioUrl);

    audio.play();
};

</script>

</body>
</html>
