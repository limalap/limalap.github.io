<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Respirômetro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="style.css">

</head>

<body>

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-12 col-md-6">

            <div class="card card-app p-4">

                <h2 class="text-center mb-1">
                    Respirômetro
                </h2>

                <p class="text-center text-muted mb-4">
                    Sopre durante a gravação
                </p>

                <canvas id="visualizer"></canvas>

                <!-- STATUS -->

                <div class="status-row mt-4 mb-3">

                    <div class="status-box">

                        <span id="statusText">
                            Status: Inicializando...
                        </span>

                    </div>

                    <button id="btnConfig"
                            class="btn-config">

                        ⚙

                    </button>

                </div>

                <!-- DEBUG -->

                <div class="debug-box mb-4">

                    <div class="debug-title">
                        DEPURAÇÃO
                    </div>

                    <pre id="debugOutput">
Aguardando análise...
                    </pre>

                </div>

                <!-- BOTÕES -->

                <div class="row g-3">

                    <div class="col-4">

                        <button id="btnRec"
                                class="btn btn-rec btn-app">

                            <div class="icon"
                                 id="iconRec">
                            </div>

                            <div class="btn-label">
                                REC
                            </div>

                        </button>

                    </div>

                    <div class="col-4">

                        <button id="btnPlay"
                                class="btn btn-play btn-app"
                                disabled>

                            <div class="icon"
                                 id="iconPlay">
                            </div>

                            <div class="btn-label">
                                PLAY
                            </div>

                        </button>

                    </div>

                    <div class="col-4">

                        <button id="btnAnalyze"
                                class="btn btn-analyze btn-app"
                                disabled>

                            <div class="icon"
                                 id="iconAnalyze">
                            </div>

                            <div class="btn-label">
                                ANÁLISE
                            </div>

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- MODAL -->

<div class="modal fade"
     id="configModal"
     tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content modal-dark">

            <div class="modal-header">

                <h5 class="modal-title">
                    Configurações
                </h5>

                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="mb-4">

                    <label class="form-label">
                        Microfone
                    </label>

                    <select id="microphoneSelect"
                            class="form-select form-select-dark">
                    </select>

                </div>

                <div>

                    <label class="form-label">
                        Método de captura
                    </label>

                    <select id="captureMethodSelect"
                            class="form-select form-select-dark">

                        <option value="finger">
                            Dedo
                        </option>

                        <option value="whistle1">
                            Apito 1
                        </option>

                        <option value="whistle2">
                            Apito 2
                        </option>

                    </select>

                </div>

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button type="button"
                        id="btnApplyConfig"
                        class="btn btn-success">

                    Aplicar

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="storage.js"></script>
<script src="icons.js"></script>
<script src="status.js"></script>
<script src="canvas.js"></script>
<script src="buttons.js"></script>
<script src="libSom.js"></script>
<script src="app.js"></script>

</body>
</html>
