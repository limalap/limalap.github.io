<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Respirômetro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-12 col-md-6">

            <div class="card card-app p-4">

                <h2 class="text-center mb-1">
                    Respirômetro
                </h2>

                <p class="text-center text-muted mb-4">
                    Sopre no apito durante a gravação
                </p>

                <canvas id="visualizer"></canvas>

                <div class="status-box mt-4 mb-4">

                    <span id="statusText">
                        Status: Pronto
                    </span>

                </div>

                <div class="row g-3 mb-3">

                    <div class="col-6">

                        <button id="btnStart"
                                class="btn btn-success btn-app w-100">
                            Gravar
                        </button>

                    </div>

                    <div class="col-6">

                        <button id="btnStop"
                                class="btn btn-danger btn-app w-100"
                                disabled>
                            Parar
                        </button>

                    </div>

                </div>

                <div class="row g-3">

                    <div class="col-6">

                        <button id="btnPlay"
                                class="btn btn-primary btn-app w-100"
                                disabled>
                            Reproduzir
                        </button>

                    </div>

                    <div class="col-6">

                        <button id="btnAnalyze"
                                class="btn btn-dark btn-app w-100"
                                disabled>
                            Analisar
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
