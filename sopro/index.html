<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Recorder Safari</title>
</head>
<body>

<button id="start">Gravar</button>
<button id="stop">Parar</button>
<button id="play">Reproduzir</button>

<p id="status"></p>

<script>

let recorder;
let chunks = [];

const status = document.getElementById("status");

async function iniciar() {

    const stream = await navigator.mediaDevices.getUserMedia({
        audio: true
    });

    recorder = new MediaRecorder(stream);

    recorder.ondataavailable = e => {
        chunks.push(e.data);
    };

    recorder.onstop = async () => {

        const blob = new Blob(chunks);

        chunks = [];

        const reader = new FileReader();

        reader.onloadend = () => {

            const base64data = reader.result;

            localStorage.setItem("audio", base64data);

            status.innerText = "Áudio salvo!";
        };

        reader.readAsDataURL(blob);
    };
}

document.getElementById("start").onclick = async () => {

    if (!recorder) {
        await iniciar();
    }

    chunks = [];

    recorder.start();

    status.innerText = "Gravando...";
};

document.getElementById("stop").onclick = () => {

    recorder.stop();

    status.innerText = "Processando...";
};

document.getElementById("play").onclick = () => {

    const audioData = localStorage.getItem("audio");

    if (!audioData) {
        alert("Nenhum áudio salvo");
        return;
    }

    const audio = new Audio(audioData);

    audio.play();
};

</script>

</body>
</html>
